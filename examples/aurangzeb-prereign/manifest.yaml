narrative:
  position: "bottom-right"
  width: 0.28
  text: >
    Aurangzeb (1618–1707) spent forty years as a Mughal prince before
    seizing the throne. Renowned for personal piety, military tenacity,
    and administrative ability, he served as viceroy in Gujarat and twice
    in the Deccan, leading campaigns as far as Central Asia. When Shah
    Jahan fell ill in 1657, four sons fought for succession. Aurangzeb
    outmanoeuvred his brothers, imprisoned his ailing father in Agra Fort,
    and was crowned Alamgir in 1658 — beginning a reign of nearly fifty years.
  reference: "Sarkar, J.N., History of Aurangzib (1912–24)"
